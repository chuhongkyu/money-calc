<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family:
          "Pretendard Variable",
          Pretendard,
          -apple-system,
          sans-serif;
        background: linear-gradient(135deg, #fff7f0 0%, #ffffff 60%);
        color: #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1040px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        color: #666;
      }
      .badge b {
        color: #ff6f0f;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .sub {
        font-size: 36px;
        color: #444;
        line-height: 1.4;
      }
      .row {
        display: flex;
        gap: 24px;
        margin-top: 12px;
      }
      .chip {
        padding: 14px 26px;
        border-radius: 999px;
        background: #fff;
        border: 2px solid #eee;
        font-size: 26px;
        color: #333;
      }
      .won {
        font-size: 120px;
        font-weight: 900;
        color: #ff6f0f;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><b>₩</b> 연봉 실수령액 계산기 · 2026년 기준</div>
      <h1>연봉 넣으면<br />바로 나오는 월 실수령액</h1>
      <div class="sub">
        4대보험 · 소득세 공제 내역까지 한 번에. 로그인 없음, 입력값은 내 기기에만.
      </div>
      <div class="row">
        <div class="chip">국민연금 4.75%</div>
        <div class="chip">건강보험 3.595%</div>
        <div class="chip">간이세액표 2026.3.1</div>
      </div>
    </div>
  </body>
</html>
